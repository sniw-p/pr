<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ボカロP 紹介ページ（サンプル）</title>
  <style>
    :root{
      --brand: #af8e76;
      --bg: #af8e76;
      --muted: #666666;
      --card-bg: #ffffff;
      --shadow: 0 6px 18px rgba(10,10,10,0.08);
      --radius: 14px;
      --max-width: 980px;
    }

    /* Reset-ish */
    *{box-sizing: border-box}
    html,body{height:100%}
    body {
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #e4bc9f 0%, #af8e76 100%);
      color: #111;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding: 40px 20px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 36px);
      display:flex;
      gap: clamp(18px, 3vw, 32px);
      align-items:center;
    }

    /* layout: left = frame, right = text */
    .frame {
      flex: 0 0 220px;
      display:flex;
      justify-content:center;
    }

    /* Photo-frame style */
    .photo {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff, #f7f3f1);
      padding: 14px; /* mat */
      box-shadow: 0 12px 30px rgba(0,0,0,0.09);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:visible;
    }

    /* Inner image area */
    .photo .img {
      width:100%;
      height:100%;
      border-radius: 6px;
      overflow:hidden;
      background: linear-gradient(135deg, #e6ded6 0%, #d9cfc7 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      box-shadow: inset 0 -6px 18px rgba(0,0,0,0.03);
    }

    /* thin decorative mat line */
    .photo::before{
      content: "";
      position:absolute;
      inset: -12px;
      border-radius: 12px;
      pointer-events: none;
      border: 6px solid #f6f2ef; /* outer frame */
    }

    /* small label like a Polaroid caption */
    .caption {
      margin-top:10px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }

    /* content area */
    .content {
      flex: 1 1 auto;
      min-width: 0;
    }

    h1{
      margin:0 0 6px 0;
      font-size: clamp(20px, 2.6vw, 28px);
      letter-spacing: -0.02em;
    }

    .tagline {
      margin:0 0 16px 0;
      color:var(--muted);
      font-size: 14px;
    }

    p.lead{
      margin:0 0 18px 0;
      line-height:1.65;
      color:#222;
      font-size:15px;
    }

    .meta {
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .btn {
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      border-radius:10px;
      text-decoration:none;
      font-size:14px;
      border: 1px solid transparent;
      background: transparent;
      color: #111;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    /* Social row */
    .social{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .social a {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-decoration:none;
      padding:8px 12px;
      border-radius:10px;
      border:1px solid rgba(175,142,118,0.18);
      background: #fff;
      color: #111;
      font-size:13px;
      min-height:40px;
      box-shadow: 0 6px 14px rgba(10,10,10,0.03);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }

    .social a:hover,
    .social a:focus {
      transform: translateY(-3px);
      border-color: var(--brand);
    }

    /* icon sizes */
    .icon {
      width:18px;
      height:18px;
      display:inline-block;
      vertical-align:middle;
    }

    /* small meta text */
    .small {
      font-size:13px;
      color:var(--muted);
    }

    /* responsive: stack on small screens */
    @media (max-width:720px){
      .container{
        flex-direction:column;
        align-items:center;
        text-align:center;
      }
      .frame{flex:0 0 auto}
      .content{width:100%}
      .social{justify-content:center}
    }
  </style>
</head>
<body>

    <!-- left: photo frame -->
    <div class="frame" aria-hidden="false">
        <!-- inner image: replace this SVG with an <img src="your-photo.jpg"> if available -->
 <iframe width="320" height="160" src="https://ext.nicovideo.jp/thumb_user/127280665" scrolling="no" style="border:solid 1px #CCC;" frameborder="0">すにぅP</iframe>

</html>
